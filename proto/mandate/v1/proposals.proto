syntax = "proto3";

package mandate.v1;

import "google/protobuf/timestamp.proto";
import "mandate/v1/evidence.proto";

option go_package = "github.com/andreas-lindfalk/pgmandate/gen/go/mandate/v1;mandatev1";

// The tenant a call acts in is chosen with the Mandate-Tenant header. The
// caller must be a person of that tenant; owners grant and define,
// reviewers decide.

service ProposalService {
  rpc ListProposals(ListProposalsRequest) returns (ListProposalsResponse);
  rpc GetProposal(GetProposalRequest) returns (GetProposalResponse);
  rpc ApproveProposal(ApproveProposalRequest) returns (ApproveProposalResponse);
  rpc RejectProposal(RejectProposalRequest) returns (RejectProposalResponse);
  // RedeliverProposal sends a failed delivery again.
  rpc RedeliverProposal(RedeliverProposalRequest) returns (RedeliverProposalResponse);
}

message ExecutionBasis {
  string mandate_id = 1;
  string policy_ref = 2;
  string max_risk = 3;
  // The mandate's budgets as the execution saw them: today one, a count.
  repeated Budget budgets = 4;
  // The mandate's condition, which held for the payload; empty when it has none.
  string condition = 7;
}

message Budget {
  // count: executions per UTC calendar month.
  string kind = 1;
  int64 limit = 2;
  // What was spent before this execution.
  int64 spent = 3;
}

message Delivery {
  string id = 1;
  string status = 2;
  int32 attempts = 3;
  string url = 4;
  string last_error = 5;
  google.protobuf.Timestamp delivered_at = 6;
  google.protobuf.Timestamp failed_at = 7;
  // What the connector answered, as JSON text; empty for none.
  string result_json = 8;
  // How many attempts are made before the delivery is marked failed.
  int32 max_attempts = 9;
}

message RedeliverProposalRequest {
  string id = 1;
}

message RedeliverProposalResponse {
  Proposal proposal = 1;
}

message Proposal {
  string id = 1;
  string agent_id = 2;
  string agent_name = 3;
  string run_id = 4;
  string action = 5;
  string risk = 6;
  string title = 7;
  string payload_json = 8;
  // Until when it waits for a decision; past it, it expires.
  google.protobuf.Timestamp expires_at = 9;
  repeated string flags = 10;
  string status = 11;
  bool edited = 12;
  string decided_by = 13;
  google.protobuf.Timestamp decided_at = 14;
  string decision_note = 15;
  google.protobuf.Timestamp created_at = 16;
  ExecutionBasis execution_basis = 17;
  // Why the last execution attempt left it for a person, if it did.
  string skip_reason = 18;
  Delivery delivery = 19;
  // The payload as the agent proposed it. It differs from payload_json
  // when a person edited it on approval.
  string proposed_payload_json = 20;
  // For a waiting proposal read on its own: the risk an approval of it
  // would run at, under the action as it is now. Empty when the action is
  // gone and it can only be rejected.
  string approval_risk = 21;
  // The agent's account: why it proposes this, what it looked at, and who
  // wrote it. As the agent gave it, never edited. Empty for a proposal made
  // before rationales existed.
  string rationale = 22;
  repeated Evidence evidence = 23;
  Provenance provenance = 24;
  // For a waiting proposal read on its own, left for a person because no
  // mandate's condition held: what in the payload stood in the way, per
  // mandate, as the mandates are now.
  repeated string unmet_conditions = 25;
}

// One thing the agent says it looked at. A claim for a person to check.
message Evidence {
  string source = 1;
  string ref = 2;
  string summary = 3;
}

// Who wrote a proposal: the MCP client as it introduced itself, and the
// model and the agent's version as the agent states them.
message Provenance {
  string client = 1;
  string client_version = 2;
  string model = 3;
  string agent_version = 4;
}

message ListProposalsRequest {
  string status = 1;
  int32 limit = 2;
  // Oldest first, as a queue is worked; newest first otherwise.
  bool oldest_first = 3;
}

message ListProposalsResponse {
  repeated Proposal proposals = 1;
  // How many proposals have the status asked for, beyond the limit too.
  int64 total = 2;
}

message GetProposalRequest {
  string id = 1;
}

message GetProposalResponse {
  Proposal proposal = 1;
  repeated Event history = 2;
}

message ApproveProposalRequest {
  string id = 1;
  string title = 2;
  // An edited payload as JSON text, empty to keep the agent's.
  string payload_json = 3;
  bool confirm = 4;
  string note = 5;
}

message ApproveProposalResponse {
  Proposal proposal = 1;
}

message RejectProposalRequest {
  string id = 1;
  string note = 2;
}

message RejectProposalResponse {
  Proposal proposal = 1;
}

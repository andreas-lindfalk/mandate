syntax = "proto3";

package mandate.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/andreas-lindfalk/pgmandate/gen/go/mandate/v1;mandatev1";

// The tenant a call acts in is chosen with the Mandate-Tenant header. The
// caller must be a person of that tenant; owners grant and define,
// reviewers decide.

service AgentService {
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc CreateAgent(CreateAgentRequest) returns (CreateAgentResponse);
  rpc RevokeAgent(RevokeAgentRequest) returns (RevokeAgentResponse);
  rpc SetAgentLimits(SetAgentLimitsRequest) returns (SetAgentLimitsResponse);
  // SetAgentMode makes an agent live or puts it in dry run. Its proposals
  // made before keep what they were.
  rpc SetAgentMode(SetAgentModeRequest) returns (SetAgentModeResponse);
  // IssueToken returns the secret once; only its hash is stored.
  rpc IssueToken(IssueTokenRequest) returns (IssueTokenResponse);
  rpc ListTokens(ListTokensRequest) returns (ListTokensResponse);
  rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse);
}

message Agent {
  string id = 1;
  string name = 2;
  string department = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp revoked_at = 5;
  // How many proposals the agent may make; the database refuses the rest.
  int32 max_per_minute = 6;
  int32 max_per_hour = 7;
  // live, or dry_run: what it proposes is recorded and never carried out.
  string mode = 8;
}

message Token {
  string id = 1;
  string agent_id = 2;
  string hint = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp expires_at = 5;
  google.protobuf.Timestamp last_used_at = 6;
  google.protobuf.Timestamp revoked_at = 7;
}

message ListAgentsRequest {}

message ListAgentsResponse {
  repeated Agent agents = 1;
}

message CreateAgentRequest {
  string name = 1;
  string department = 2;
  // live or dry_run; empty is dry_run, so a new agent changes nothing
  // until an owner makes it live.
  string mode = 3;
}

message CreateAgentResponse {
  Agent agent = 1;
}

message RevokeAgentRequest {
  string id = 1;
}

message RevokeAgentResponse {}

message SetAgentLimitsRequest {
  string id = 1;
  int32 max_per_minute = 2;
  int32 max_per_hour = 3;
}

message SetAgentLimitsResponse {
  Agent agent = 1;
}

message SetAgentModeRequest {
  string id = 1;
  // live or dry_run.
  string mode = 2;
}

message SetAgentModeResponse {
  Agent agent = 1;
}

message IssueTokenRequest {
  string agent_id = 1;
  int32 days = 2;
}

message IssueTokenResponse {
  Token token = 1;
  string secret = 2;
}

message ListTokensRequest {
  string agent_id = 1;
}

message ListTokensResponse {
  repeated Token tokens = 1;
}

message RevokeTokenRequest {
  string id = 1;
}

message RevokeTokenResponse {}

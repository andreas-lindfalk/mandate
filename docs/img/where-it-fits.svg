<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 340" width="1020" height="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Where pgmandate fits</title>
  <desc id="desc">Agents in any language call pgmandate's agent API over MCP or HTTP, directly or through an optional gateway. People use the UI and the people's API. Both write to Postgres, which holds the rules, the mandates and the log. Decided proposals go as signed deliveries to receivers next to your systems, such as one for refunds and one for accounts.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
    <style>
      .box { stroke-width: 1.5; }
      .title { font-size: 15px; font-weight: 600; fill: #1f2328; }
      .sub { font-size: 12.5px; fill: #424a53; }
      .group { font-size: 13px; font-weight: 600; fill: #424a53; letter-spacing: .02em; }
      .edge { stroke: #8c959f; stroke-width: 2; fill: none; }
      .pill { fill: #f6f8fa; stroke: #d0d7de; }
      .label { font-size: 12.5px; fill: #1f2328; }
    </style>
  </defs>

  <!-- Agents -->
  <rect class="box" x="20" y="130" width="220" height="100" rx="10" fill="#ddf4ff" stroke="#54aeff"/>
  <text class="title" x="130" y="160" text-anchor="middle">Agents, any language</text>
  <text class="sub" x="130" y="182" text-anchor="middle">OpenAI Agents SDK, LangGraph,</text>
  <text class="sub" x="130" y="200" text-anchor="middle">Claude Agent SDK,</text>
  <text class="sub" x="130" y="218" text-anchor="middle">any MCP client</text>

  <!-- Gateway, optional -->
  <rect class="box" x="230" y="22" width="170" height="58" rx="10" fill="#f6f8fa" stroke="#afb8c1" stroke-dasharray="6 4"/>
  <text class="title" x="315" y="46" text-anchor="middle">Gateway, optional</text>
  <text class="sub" x="315" y="66" text-anchor="middle">routes and filters calls</text>

  <!-- pgmandate -->
  <rect x="440" y="22" width="310" height="300" rx="14" fill="#fff8f2" stroke="#fb8f44" stroke-width="1.5"/>
  <text class="group" x="458" y="46">pgmandate</text>
  <rect class="box" x="458" y="62" width="132" height="64" rx="8" fill="#ffffff" stroke="#fb8f44"/>
  <text class="title" x="524" y="89" text-anchor="middle">Agent API</text>
  <text class="sub" x="524" y="109" text-anchor="middle">MCP or HTTP</text>
  <rect class="box" x="600" y="62" width="132" height="64" rx="8" fill="#ffffff" stroke="#fb8f44"/>
  <text class="title" x="666" y="89" text-anchor="middle">UI and the</text>
  <text class="title" x="666" y="109" text-anchor="middle">people's API</text>
  <path class="box" d="M495,196 a100,12 0 0 1 200,0 v90 a100,12 0 0 1 -200,0 z" fill="#fff1e5" stroke="#fb8f44"/>
  <path d="M495,196 a100,12 0 0 0 200,0" fill="none" stroke="#fb8f44" stroke-width="1.5"/>
  <text class="title" x="595" y="238" text-anchor="middle">Postgres</text>
  <text class="sub" x="595" y="258" text-anchor="middle">rules, mandates, the log</text>

  <!-- Next to your systems -->
  <rect x="800" y="70" width="200" height="220" rx="14" fill="#f3fcf5" stroke="#4ac26b" stroke-width="1.5"/>
  <text class="group" x="816" y="94">Next to your systems</text>
  <rect class="box" x="816" y="112" width="168" height="62" rx="8" fill="#dafbe1" stroke="#4ac26b"/>
  <text class="title" x="900" y="139" text-anchor="middle">Receiver</text>
  <text class="sub" x="900" y="158" text-anchor="middle">refunds</text>
  <rect class="box" x="816" y="196" width="168" height="62" rx="8" fill="#dafbe1" stroke="#4ac26b"/>
  <text class="title" x="900" y="223" text-anchor="middle">Receiver</text>
  <text class="sub" x="900" y="242" text-anchor="middle">accounts</text>

  <!-- Agents to the agent API, directly or through a gateway -->
  <path class="edge" d="M242,170 C340,170 400,150 456,112" marker-end="url(#arrow)"/>
  <path class="edge" d="M150,128 C150,80 190,52 226,52" marker-end="url(#arrow)"/>
  <path class="edge" d="M402,52 C430,52 440,70 456,82" marker-end="url(#arrow)"/>
  <!-- Into Postgres -->
  <line class="edge" x1="524" y1="128" x2="560" y2="180" marker-end="url(#arrow)"/>
  <line class="edge" x1="666" y1="128" x2="632" y2="180" marker-end="url(#arrow)"/>
  <!-- Signed deliveries -->
  <path class="edge" d="M697,232 C750,232 770,150 812,145" marker-end="url(#arrow)"/>
  <path class="edge" d="M697,250 C750,250 770,228 812,227" marker-end="url(#arrow)"/>
  <rect class="pill" x="838" y="300" width="124" height="20" rx="10"/>
  <text class="label" x="900" y="314" text-anchor="middle">signed deliveries</text>
</svg>

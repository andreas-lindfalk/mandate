# Publishes the image when a release tag is pushed: `git push origin v0.1.0`,
# or a release published on GitHub with a new tag. The image reports the tag
# as its version. After the very first publish, the package is made public
# once in its settings on GitHub.
#
# No emulator is installed: the Dockerfile builds on the runner and
# cross-compiles, so a step that needed one would fail at once instead of
# hanging. The time limit is there because a build did hang once, for six hours.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=pgmandate
            org.opencontainers.image.description=Agents propose, a person or a mandate decides, Postgres checks again.
            org.opencontainers.image.licenses=Apache-2.0
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

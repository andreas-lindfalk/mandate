version: v2
clean: true
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.19.1
    out: gen/go
    opt:
      - paths=source_relative
      - simple
  - remote: buf.build/bufbuild/es:v2.16.0
    out: web/src/gen
    opt:
      - target=ts
      - import_extension=none
